apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-database
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: moto-secrets-manager
    kind: SecretStore
  target:
    name: demo-database
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: /demo/database
        property: username
    - secretKey: password
      remoteRef:
        key: /demo/database
        property: password
